# ============================================================================
#  Éco-Responsable — pipeline unique (monorepo)
#
#  Un seul fichier, découpé en sous-workflows (jobs) chaînés :
#
#    1. qualite      analyse + tests du cœur partagé (shared/) et des 3 apps
#    2. mobile       Android APK + AAB (mobile/)          [+ iOS sans signature]
#    3. desktop      Linux .tar.gz / Windows .zip / macOS .app (desktop/)
#    4. web          bundle web statique (web/)
#    5. publication  release GitHub avec tous les artefacts, sur tag v*
#
#  Déclencheurs : push master / tags v* / pull request / manuel.
#  Sur PR, seuls qualite + android + linux + web tournent (rapide) ; iOS,
#  Windows et macOS tournent sur master, sur tag, ou à la demande.
# ============================================================================
name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      toutes_plateformes:
        description: "Construire aussi iOS, Windows et macOS"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.1"
  JAVA_VERSION: "21"
  # Valeurs publiques (identifient le projet Appwrite Cloud, jamais la clé serveur).
  APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT || 'https://fra.cloud.appwrite.io/v1' }}
  APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID || 'eco-responsable-cm' }}
  DEFINES: >-
    --dart-define=APPWRITE_ENDPOINT=${{ vars.APPWRITE_ENDPOINT || 'https://fra.cloud.appwrite.io/v1' }}
    --dart-define=APPWRITE_PROJECT_ID=${{ vars.APPWRITE_PROJECT_ID || 'eco-responsable-cm' }}

defaults:
  run:
    shell: bash

jobs:
  # --------------------------------------------------------------------------
  # 1. Qualité : analyse + tests (shared + mobile + desktop + web)
  # --------------------------------------------------------------------------
  qualite:
    name: "1 · Analyse & tests"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cœur partagé — dépendances + l10n
        working-directory: shared
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Cœur partagé — analyse statique
        working-directory: shared
        run: flutter analyze --fatal-infos

      - name: Cœur partagé — tests
        working-directory: shared
        run: flutter test --coverage --reporter expanded

      - name: Applications — analyse statique
        run: |
          for app in mobile desktop web; do
            echo "::group::$app"
            (cd "$app" && flutter pub get && flutter analyze --fatal-infos)
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: couverture-lcov
          path: shared/coverage/lcov.info
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # 2. Mobile — Android
  # --------------------------------------------------------------------------
  android:
    name: "2 · Mobile — Android (APK + AAB)"
    needs: qualite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release $DEFINES

      - name: Build AppBundle release
        run: flutter build appbundle --release $DEFINES

      - name: Renommer les artefacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/eco-responsable-mobile-android.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/eco-responsable-mobile-android.aab

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: mobile/dist/*
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # 2b. Mobile — iOS (compilation sans signature)
  # --------------------------------------------------------------------------
  ios:
    name: "2 · Mobile — iOS (sans signature)"
    needs: qualite
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.toutes_plateformes)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build iOS
        run: |
          flutter pub get
          flutter build ios --release --no-codesign $DEFINES

      - name: Archiver
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app dist/eco-responsable-mobile-ios-unsigned.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ios
          path: mobile/dist/*
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # 3. Desktop — Linux
  # --------------------------------------------------------------------------
  linux:
    name: "3 · Desktop — Linux x64"
    needs: qualite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système GTK
        run: |
          sudo apt-get update
          # webkit2gtk : requis par desktop_webview_window (flutter_web_auth_2)
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            libwebkit2gtk-4.1-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Linux
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release $DEFINES

      - name: Archiver
        run: |
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf dist/eco-responsable-desktop-linux-x64.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: desktop/dist/*
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # 3b. Desktop — Windows
  # --------------------------------------------------------------------------
  windows:
    name: "3 · Desktop — Windows x64"
    needs: qualite
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.toutes_plateformes)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Windows
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release $DEFINES

      - name: Archiver
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/eco-responsable-desktop-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: desktop/dist/*
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # 3c. Desktop — macOS
  # --------------------------------------------------------------------------
  macos:
    name: "3 · Desktop — macOS"
    needs: qualite
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.toutes_plateformes)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build macOS (non signé)
        run: |
          flutter config --enable-macos-desktop
          flutter pub get
          flutter build macos --release $DEFINES

      - name: Archiver
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/macos/Build/Products/Release/*.app dist/eco-responsable-desktop-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: desktop/dist/*
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # 4. Web
  # --------------------------------------------------------------------------
  web:
    name: "4 · Web"
    needs: qualite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build web
        run: |
          flutter pub get
          flutter build web --release --base-href / $DEFINES

      - name: Archiver
        run: |
          mkdir -p dist
          tar -C build/web -czf dist/eco-responsable-web.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web/dist/*
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # 5. Publication (tags v* uniquement)
  # --------------------------------------------------------------------------
  publication:
    name: "5 · Release GitHub"
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios, linux, windows, macos, web]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
          merge-multiple: true

      - name: Sommes de contrôle
        run: |
          cd artefacts
          sha256sum * > SHA256SUMS.txt
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          name: "Éco-Responsable ${{ github.ref_name }}"
          generate_release_notes: true
          files: artefacts/*
