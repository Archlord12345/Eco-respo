name: eco_responsable
description: Plateforme citoyenne de gestion des déchets — Cameroun.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  appwrite: ^13.0.0
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  file_picker: ^8.3.7
  hive_flutter: ^1.1.0
  google_fonts: ^6.2.1
  intl: ^0.20.2
  http: ^1.5.0
  path_provider: ^2.1.5
  geolocator: ^13.0.2
  fl_chart: ^0.70.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.5

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
