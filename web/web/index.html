<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Éco-Responsable — signalez les dépôts sauvages, demandez une collecte et gagnez des récompenses. Plateforme citoyenne de gestion des déchets au Cameroun.">
  <meta name="theme-color" content="#2E7D32">

  <meta property="og:title" content="Éco-Responsable">
  <meta property="og:description" content="Signalez, collectez, gagnez. Ensemble pour des villes plus propres.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Éco-Responsable">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Éco-Responsable</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #2E7D32; }
    #eco-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      background: #2E7D32; color: #fff; font-family: system-ui, sans-serif;
      transition: opacity .35s ease;
    }
    #eco-splash img { width: 112px; height: 112px; border-radius: 28px; box-shadow: 0 12px 32px rgba(0,0,0,.25); }
    #eco-splash p { margin: 0; font-size: 15px; opacity: .85; letter-spacing: .3px; }
    #eco-splash .bar { width: 160px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.25); overflow: hidden; }
    #eco-splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #fff; border-radius: 2px;
      animation: eco-slide 1.1s ease-in-out infinite;
    }
    @keyframes eco-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  </style>
</head>
<body>
  <div id="eco-splash">
    <img src="icons/Icon-192.png" alt="Éco-Responsable">
    <p>Éco-Responsable</p>
    <div class="bar"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('eco-splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
