name: eco_web
description: Éco-Responsable — application web (citoyens, collecteurs, back-office) déployable sur n'importe quel hébergeur statique.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  eco_core:
    path: ../shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: false
  ios: false
  image_path: ../shared/assets/branding/app_icon.png
  web:
    generate: true
    image_path: ../shared/assets/branding/app_icon.png
    background_color: "#2E7D32"
    theme_color: "#2E7D32"
