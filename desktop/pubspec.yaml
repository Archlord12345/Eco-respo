name: eco_desktop
description: Éco-Responsable — back-office desktop pour la municipalité et les entreprises de collecte (Linux, Windows, macOS).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  eco_core:
    path: ../shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: false
  ios: false
  image_path: ../shared/assets/branding/app_icon.png
  windows:
    generate: true
    image_path: ../shared/assets/branding/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: ../shared/assets/branding/app_icon.png
