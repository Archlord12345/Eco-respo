name: eco_core
description: Cœur partagé Éco-Responsable — modèles, Appwrite, thème, écrans et navigation communs aux apps mobile, desktop et web.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.13.1
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  appwrite: ^26.2.0
  flutter_map: ^8.1.1
  latlong2: ^0.10.1
  image_picker: ^1.1.2
  file_picker: ^13.1.0
  hive_flutter: ^1.1.0
  google_fonts: ^8.2.1
  intl: ^0.20.2
  crypto: ^3.0.6
  http: ^1.5.0
  path_provider: ^2.1.5
  geolocator: ^14.0.3
  fl_chart: ^1.2.0
  url_launcher: ^6.3.1
  animations: ^3.0.0
  flutter_animate: ^4.5.2
  device_info_plus: ^13.2.0
  flutter_web_auth_2: ^5.1.0
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.5

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/auth/
    - assets/images/logos/
    - assets/images/map/
    - assets/images/payments/
    - assets/images/profile/
    - assets/images/reporting/
    - assets/images/rewards/
    - assets/images/shared/
